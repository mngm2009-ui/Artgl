<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة منتجات المحل</title>
    <!-- مكتبة قراءة الباركود من الكاميرا والصور -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 420px; margin: auto; background: white; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e293b; margin-top: 0; }
        label { display: block; margin-top: 14px; font-weight: bold; color: #475569; font-size: 14px; }
        input, select { width: 100%; padding: 11px; margin-top: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #0284c7; box-shadow: 0 0 0 2px rgba(2,132,199,0.2); }
        
        .weight-box { display: flex; gap: 8px; }
        .weight-box input { flex: 2; }
        .weight-box select { flex: 1; }
        
        .scan-btn { background: #0284c7; margin-top: 8px; color: white; border: none; padding: 13px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; }
        .scan-btn:active { background: #0369a1; }

        .no-barcode-btn { background: #e2e8f0; margin-top: 8px; color: #334155; border: none; padding: 9px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        button.save-btn { width: 100%; background: #16a34a; color: white; border: none; padding: 13px; margin-top: 20px; border-radius: 8px; font-size: 17px; cursor: pointer; font-weight: bold; }
        button.save-btn:active { background: #15803d; }
        
        #message { text-align: center; margin-top: 16px; font-weight: bold; font-size: 15px; min-height: 24px; }
        
        #cropContainer { display: none; margin-top: 15px; text-align: center; background: #0f172a; padding: 10px; border-radius: 8px; }
        #previewCanvas { max-width: 100%; border: 2px dashed #38bdf8; cursor: crosshair; display: block; margin: 0 auto; touch-action: none; }
        .crop-instructions { color: #f8fafc; font-size: 13px; margin-bottom: 8px; }
        .confirm-crop-btn { background: #16a34a; color: white; border: none; padding: 10px; width: 100%; margin-top: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة وتعديل المنتجات</h2>
    
    <label for="barcode">كود المنتج (Barcode):</label>
    <input type="text" id="barcode" placeholder="امسح أو اكتب الباركود...">
    
    <button type="button" class="scan-btn" onclick="document.getElementById('nativeCamera').click();">📸 التقاط صورة الباركود</button>
    <input type="file" id="nativeCamera" accept="image/*" capture="environment" style="display:none;" onchange="loadCropper(this)">

    <div id="cropContainer">
        <div class="crop-instructions">👉 اسحب بإصبعك وحدد خطوط الباركود داخل الصورة:</div>
        <canvas id="previewCanvas"></canvas>
        <button type="button" class="confirm-crop-btn" onclick="readCroppedBarcode()">✔ قراءة الباركود من الجزء المحدد</button>
    </div>

    <button type="button" class="no-barcode-btn" onclick="setNoBarcode()">🏷️ منتج بدون باركود (توليد كود آلي)</button>

    <label for="name">اسم المنتج:</label>
    <input type="text" id="name" placeholder="مثال: سجق أصابع / مياه معدنية">

    <label for="category">القسم:</label>
    <select id="category">
        <option value="مشروبات">مشروبات (Getränke)</option>
        <option value="معلبات وأغذية">معلبات وأغذية (Food)</option>
        <option value="حلويات ومقرمشات">حلويات ومقرمشات (Süßwaren)</option>
        <option value="خضار وفواكه">خضار وفواكه (Obst & Gemüse)</option>
        <option value="منظفات ومستلزمات">منظفات ومستلزمات (Haushalt)</option>
        <option value="أخرى">أخرى (Sonstiges)</option>
    </select>

    <label for="price">السعر الأساسي للمنتج (€):</label>
    <input type="number" step="0.01" id="price" placeholder="مثال: 4.00">

    <label for="offer">سعر العرض (€) - اختياري:</label>
    <input type="number" step="0.01" id="offer" placeholder="مثال: 3.49">

    <label>الوزن أو الحجم (Grundpreis):</label>
    <div class="weight-box">
        <input type="text" id="weightValue" placeholder="مثال: 1 أو 500">
        <select id="weightUnit">
            <option value="kg">kg (كغ)</option>
            <option value="g">g (غرام)</option>
            <option value="l">l (لتر)</option>
            <option value="ml">ml (مل)</option>
            <option value="Stück">Stück (قطعة)</option>
        </select>
    </div>

    <label for="quantity">الكمية في المخزون:</label>
    <input type="number" id="quantity" placeholder="مثال: 20">

    <button class="save-btn" onclick="checkAndSave()">💾 حفظ وتحديث في الشيت</button>
    <p id="message"></p>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6VkxJteGJAeQaR5oTqdYValeCbxP62sr71HzkbcYy9kviVPb3cdK4-fdCgb0uibIHIA/exec";

    let loadedImage = new Image();
    let canvas, ctx;
    let startX, startY, endX, endY, isDrawing = false;
    let imgScale = 1;

    function loadCropper(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                loadedImage.onload = function () {
                    document.getElementById('cropContainer').style.display = 'block';
                    canvas = document.getElementById('previewCanvas');
                    ctx = canvas.getContext('2d');

                    const maxWidth = 340;
                    imgScale = loadedImage.width > maxWidth ? maxWidth / loadedImage.width : 1;
                    canvas.width = loadedImage.width * imgScale;
                    canvas.height = loadedImage.height * imgScale;

                    ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

                    startX = canvas.width * 0.15;
                    startY = canvas.height * 0.35;
                    endX = canvas.width * 0.85;
                    endY = canvas.height * 0.65;
                    drawSelectionBox();

                    setupTouchEvents();
                };
                loadedImage.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
        input.value = '';
    }

    function drawSelectionBox() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let x = Math.min(startX, endX);
        let y = Math.min(startY, endY);
        let w = Math.abs(endX - startX);
        let h = Math.abs(endY - startY);

        ctx.clearRect(x, y, w, h);
        ctx.drawImage(loadedImage, x / imgScale, y / imgScale, w / imgScale, h / imgScale, x, y, w, h);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);
    }

    function setupTouchEvents() {
        let getPos = (e) => {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        canvas.onmousedown = (e) => { isDrawing = true; let pos = getPos(e); startX = pos.x; startY = pos.y; };
        canvas.onmousemove = (e) => { if (!isDrawing) return; let pos = getPos(e); endX = pos.x; endY = pos.y; drawSelectionBox(); };
        canvas.onmouseup = () => { isDrawing = false; };

        canvas.ontouchstart = (e) => { isDrawing = true; let pos = getPos(e); startX = pos.x; startY = pos.y; e.preventDefault(); };
        canvas.ontouchmove = (e) => { if (!isDrawing) return; let pos = getPos(e); endX = pos.x; endY = pos.y; drawSelectionBox(); e.preventDefault(); };
        canvas.ontouchend = () => { isDrawing = false; };
    }

    function readCroppedBarcode() {
        const msg = document.getElementById('message');
        msg.style.color = '#0284c7';
        msg.innerText = '⚙️ جاري قراءة الباركود بدقة...';

        let x = Math.min(startX, endX) / imgScale;
        let y = Math.min(startY, endY) / imgScale;
        let w = Math.abs(endX - startX) / imgScale;
        let h = Math.abs(endY - startY) / imgScale;

        let cropCanvas = document.createElement('canvas');
        cropCanvas.width = w;
        cropCanvas.height = h;
        let cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(loadedImage, x, y, w, h, 0, 0, w, h);

        const codeReader = new ZXing.BrowserBarcodeReader();
        codeReader.decodeFromImage(cropCanvas)
            .then(result => {
                document.getElementById('barcode').value = result.text;
                msg.style.color = '#16a34a';
                msg.innerText = '✅ تم قراءة الكود بنجاح!';
                document.getElementById('cropContainer').style.display = 'none';
            })
            .catch(err => {
                msg.style.color = '#ef4444';
                msg.innerText = '❌ لم يتم العثور على باركود بداخل التحديد، اضبط المربع بدقة';
            });
    }

    function setNoBarcode() {
        document.getElementById('cropContainer').style.display = 'none';
        const randomCode = "LOCAL-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('barcode').value = randomCode;
    }

    function checkAndSave() {
        let barcode = document.getElementById('barcode').value.trim();
        const name = document.getElementById('name').value.trim();
        const category = document.getElementById('category').value;
        const price = document.getElementById('price').value.trim();
        const offer = document.getElementById('offer') ? document.getElementById('offer').value.trim() : '';
        
        const val = document.getElementById('weightValue').value.trim();
        const unit = document.getElementById('weightUnit').value;
        const weight = val ? (val + " " + unit) : ''; 

        const quantity = document.getElementById('quantity').value.trim();
        const msg = document.getElementById('message');

        if(!barcode) {
            barcode = "NO-BARCODE-" + Math.floor(1000 + Math.random() * 9000);
        }

        if(!name || !price) {
            msg.style.color = '#ef4444';
            msg.innerText = '⚠️ الرجاء إدخال اسم المنتج والسعر على الأقل!';
            return;
        }

        msg.style.color = '#0284c7';
        msg.innerText = '⏳ جاري الحفظ والتعديل في Google Sheets...';

        const params = new URLSearchParams({
            action: 'update',
            barcode: barcode,
            name: name,
            category: category,
            price: price,
            offer: offer,
            size: weight,
            quantity: quantity || 0,
            _t: new Date().getTime()
        });

        const targetUrl = `${SCRIPT_URL}?${params.toString()}`;

        // إرسال عبر عنصر صورة في الخلفية لضمان تخطي حظر CORS تماماً
        const pingImg = new Image();
        pingImg.src = targetUrl;

        // إرسال احتياطي عبر fetch
        fetch(targetUrl, { mode: 'no-cors' }).catch(() => {});

        setTimeout(() => {
            msg.style.color = '#16a34a';
            msg.innerText = '✅ تم حفظ وتحديث المنتج بنجاح في الشيت!';
            
            setTimeout(() => {
                document.getElementById('barcode').value = '';
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                if(document.getElementById('offer')) document.getElementById('offer').value = '';
                document.getElementById('weightValue').value = '';
                document.getElementById('quantity').value = '';
                msg.innerText = '';
            }, 1200);
        }, 1000);
    }
</script>

</body>
</html>
